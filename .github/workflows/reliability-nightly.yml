# Reliability nightly (docs/36 §5.1, docs/13 "Flaky tests" and "Crash drills").
# RLB-04: the Rust tests five times and the browser suite with --repeat-each=3, at background CPU
# priority. A failure here is a flake to fix at its root (tracker row, no timeout raise).
# RLB-01: the reduced single-node crash drill (kill -9 under edits, during a save, during a
# migration) on SQLite and MySQL 8.4.

name: Reliability nightly

on:
  schedule:
    - cron: "07 4 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  OC_DEV: "1"

jobs:
  rust-repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/repeat-tests.sh 5 --workspace

  browser-repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: npm ci && npx playwright install --with-deps chromium webkit
        working-directory: e2e
      - run: nice npx playwright test --repeat-each=3
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-repeat-report
          path: |
            e2e/playwright-report
            e2e/test-results

  crash-drill:
    # RLB-01: scripts/crash-drill.sh --reduced (100 rooms x 2, 30 s per drill): kill -9 during
    # edits, during in-flight saves and during migrations; 0 acknowledged edits lost.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        store:
          - { name: sqlite, url: "" }
          - { name: mysql, url: "mysql://root:root@127.0.0.1:33062/opencanvas" }
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: opencanvas }
        ports: ["33062:3306"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p oc-server --bin opencanvas -p oc-bench --bin oc-bench
      - name: wait for the database
        if: matrix.store.name != 'sqlite'
        run: for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/33062) 2>/dev/null && exit 0; sleep 2; done; exit 1
      - name: reduced crash drill
        env:
          SKIP_BUILD: "1"
          DATABASE_URL: ${{ matrix.store.url }}
        run: bash scripts/crash-drill.sh --reduced
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: crash-drill-${{ matrix.store.name }}, path: bench/results }
