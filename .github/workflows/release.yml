# Copyright 2026 CasualOffice
#
# Release artefacts for a tag v*: two multi-architecture container images (linux/amd64 and
# linux/arm64, built natively on each architecture, no emulation), the engine at
# ghcr.io/casualoffice/opencanvas:<version> and OpenCanvas Workspace (ADR-085, docs/40) at
# ghcr.io/casualoffice/opencanvas-workspace:<version>, and standalone Linux binaries (with the editor
# bundle, LICENSE and NOTICE) attached to the GitHub release with SHA-256 checksums. Both carry
# build-provenance attestations. CycloneDX SBOMs for the Rust server and the web packages are
# attached too (DEP-01, docs/38 §5). Pre-releases never get the `latest` tag.
# The publish job adds SHA256SUMS (every attached file), install.sh (scripts/install.sh with this
# release as its default) and the packaged Helm chart, and a "Quick start" section to the notes.
#
# Runs on a pushed tag, or by hand for an existing tag (workflow_dispatch, input `tag`).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.0-alpha.1"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/casualoffice/opencanvas
  WS_IMAGE: ghcr.io/casualoffice/opencanvas-workspace
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  image:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/CasualOffice/opencanvas
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=OpenCanvas
            org.opencontainers.image.description=Embeddable real-time collaborative canvas
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          d='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    needs: image
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "digest-*", path: /tmp/digests, merge-multiple: true }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-architecture tag
        id: push
        run: |
          version="${TAG#v}"
          tags=(-t "$IMAGE:$version" -t "$IMAGE:$TAG")
          # Only a final release (no "-" pre-release part) moves `latest`.
          case "$version" in *-*) ;; *) tags+=(-t "$IMAGE:latest") ;; esac
          cd /tmp/digests
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$version"
          digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # OpenCanvas Workspace (ADR-085): the same per-architecture build and manifest as the engine,
  # from deploy/workspace/Dockerfile, under its own name and cache scope.
  workspace-image:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/workspace/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/CasualOffice/opencanvas
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=OpenCanvas Workspace
            org.opencontainers.image.description=Self-hosted workspace for documents, spreadsheets, whiteboards and databases
          outputs: type=image,name=${{ env.WS_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=workspace-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=workspace-${{ matrix.arch }}
      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          d='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  workspace-manifest:
    needs: workspace-image
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "workspace-digest-*", path: /tmp/digests, merge-multiple: true }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-architecture tag
        id: push
        run: |
          version="${TAG#v}"
          tags=(-t "$WS_IMAGE:$version" -t "$WS_IMAGE:$TAG")
          # Only a final release (no "-" pre-release part) moves `latest`.
          case "$version" in *-*) ;; *) tags+=(-t "$WS_IMAGE:latest") ;; esac
          cd /tmp/digests
          sources=()
          for d in *; do sources+=("$WS_IMAGE@sha256:$d"); done
          test "${#sources[@]}" -eq 2 || { echo "expected 2 digests, got ${#sources[@]}"; exit 1; }
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$WS_IMAGE:$version"
          digest=$(docker buildx imagetools inspect "$WS_IMAGE:$version" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.WS_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: cd web && pnpm install --frozen-lockfile && pnpm --filter @opencanvas/editor build
      - uses: actions/upload-artifact@v4
        with:
          name: editor-dist
          path: web/packages/editor/dist
          retention-days: 1

  # CycloneDX SBOMs from the tagged lockfiles: the server's crates (cargo-cyclonedx) and the web
  # packages' production dependencies (cdxgen reads pnpm-lock.yaml). Tool versions are pinned.
  sbom:
    runs-on: ubuntu-24.04
    container: rust:1.98-bookworm
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Rust SBOM
        run: |
          cargo install --locked cargo-cyclonedx --version 0.5.10
          cargo cyclonedx --format json --spec-version 1.5
          mkdir -p sbom
          f=crates/oc-server/oc-server.cdx.json
          test -s "$f" || { echo "no $f; written:"; find . -name '*.cdx.json' -not -path './target/*'; exit 1; }
          cp "$f" "sbom/opencanvas-${TAG}-rust.cdx.json"
          f=crates/oc-workspace/oc-workspace.cdx.json
          test -s "$f" || { echo "no $f; written:"; find . -name '*.cdx.json' -not -path './target/*'; exit 1; }
          cp "$f" "sbom/opencanvas-workspace-${TAG}-rust.cdx.json"
      - name: npm SBOM
        run: |
          npx -y @cyclonedx/cdxgen@12.9.0 -t js --required-only --no-install-deps --spec-version 1.6 \
            -o "sbom/opencanvas-${TAG}-web.cdx.json" web
          node -e 'const b=require(process.argv[1]); if (b.bomFormat!=="CycloneDX"||!(b.components||[]).length) process.exit(1)' \
            "$PWD/sbom/opencanvas-${TAG}-web.cdx.json"
      - name: Checksums
        run: cd sbom && for f in *.cdx.json; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/*
          retention-days: 1

  binary:
    needs: web
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    # Debian bookworm's glibc (2.36), so the binary runs on most current Linux distributions.
    container: rust:1.98-bookworm
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - name: Build the server
        run: cargo build --release --locked -p oc-server --bin opencanvas
      - uses: actions/download-artifact@v4
        with: { name: editor-dist, path: web-dist }
      - name: Package
        id: pkg
        run: |
          name="opencanvas-${TAG}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/opencanvas "dist/$name/"
          cp -r web-dist "dist/$name/web"
          cp LICENSE NOTICE README.md "dist/$name/"
          cat > "dist/$name/RUN.txt" <<EOF
          Run the server with the bundled editor:
            OC_WEB_DIR=./web OC_HOSTS_FILE=./opencanvas.hosts.toml OC_KEK=<32 bytes, base64> ./opencanvas
          Settings: docs/13-OPERATIONS-AND-DEPLOYMENT.md in the repository.
          EOF
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.pkg.outputs.file }}
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: dist/*.tar.gz*
          retention-days: 1

  publish:
    needs: [manifest, workspace-manifest, binary, sbom]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/download-artifact@v4
        with: { pattern: "binary-*", path: assets, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: sbom, path: assets }
      - uses: azure/setup-helm@v4
        with: { version: v3.16.3 }
      - name: Install script, Helm chart and SHA256SUMS
        run: |
          version="${TAG#v}"
          # The attached install.sh installs this release by default (scripts/install.sh: the latest).
          sed "s/^DEFAULT_VERSION=\"\"\$/DEFAULT_VERSION=\"$TAG\"/" scripts/install.sh > assets/install.sh
          grep -qx "DEFAULT_VERSION=\"$TAG\"" assets/install.sh
          sh -n assets/install.sh
          helm package deploy/helm/opencanvas --version "$version" --app-version "$version" -d assets
          cd assets
          sha256sum -- *.tar.gz *.cdx.json *.tgz install.sh > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Attach the binaries and the image reference to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.manifest.outputs.digest }}
          WS_DIGEST: ${{ needs.workspace-manifest.outputs.digest }}
        run: |
          version="${TAG#v}"
          dl="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          gh release upload "$TAG" assets/* --clobber -R "$GITHUB_REPOSITORY"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body > body.md
          # Quick start goes first; a re-run (workflow_dispatch) does not add it twice.
          if ! grep -q "^## Quick start" body.md; then
            {
              echo "## Quick start"
              echo
              echo "Container (linux/amd64, linux/arm64); \`OC_DEV=1\` starts it without a key, for a first look:"
              echo
              echo '```sh'
              echo "docker run -p 8080:8080 -e OC_DEV=1 $IMAGE:$version"
              echo '```'
              echo
              echo "Linux binary (x86_64, aarch64), checked against \`SHA256SUMS\` and installed to \`~/.local/bin\` (\`/usr/local/bin\` as root). macOS: use the container or build from source."
              echo
              echo '```sh'
              echo "curl -fsSL $dl/install.sh | sh"
              echo '```'
              echo
              echo "Kubernetes (Helm 3), with the chart attached to this release:"
              echo
              echo '```sh'
              echo "helm install oc $dl/opencanvas-$version.tgz --set secrets.kek=\$(openssl rand -base64 32) \\"
              echo "  --set publicUrl=https://canvas.example.com --set-file hosts.toml=opencanvas.hosts.toml"
              echo '```'
              echo
              echo "For production (\`OC_KEK\`, the hosts file, the database), see [operations](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/13-OPERATIONS-AND-DEPLOYMENT.md)."
              echo
              cat body.md
            } > quick.md
            mv quick.md body.md
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file body.md
          fi
          if ! grep -q "## Container image" body.md; then
            {
              echo
              echo "## Container image"
              echo
              echo "Multi-architecture (linux/amd64, linux/arm64):"
              echo
              echo '```sh'
              echo "docker pull $IMAGE:${TAG#v}"
              echo "docker pull $IMAGE@$DIGEST   # pinned by digest"
              echo '```'
              echo
              echo "## OpenCanvas Workspace image"
              echo
              echo "Documents, spreadsheets, whiteboards and databases in one container (linux/amd64, linux/arm64; guide: docs/42-WORKSPACE-GUIDE.md):"
              echo
              echo '```sh'
              echo "docker run -p 8080:8080 -v opencanvas:/data $WS_IMAGE:${TAG#v}"
              echo "docker pull $WS_IMAGE@$WS_DIGEST   # pinned by digest"
              echo '```'
              echo
              echo "## Binaries"
              echo
              echo "Standalone Linux builds (x86_64, aarch64) with the editor bundle, LICENSE and NOTICE are attached below, each with a SHA-256 checksum; \`SHA256SUMS\` covers every attached file (\`sha256sum -c --ignore-missing SHA256SUMS\`). Images and archives carry build-provenance attestations (\`gh attestation verify\`)."
              echo
              echo "## Software bill of materials"
              echo
              echo "CycloneDX SBOMs for the server's and the Workspace's crates (\`*-rust.cdx.json\`) and the web packages (\`*-web.cdx.json\`) are attached, with checksums. Update policy: docs/39-DEPENDENCY-UPDATES.md."
            } >> body.md
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file body.md
          fi
