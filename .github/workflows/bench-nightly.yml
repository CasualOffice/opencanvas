# Nightly benchmark quick runs (docs/36 §3.4, ADR-079; BENCH-04). The server scenarios at
# `--size quick` on SQLite, MySQL and MariaDB, and the browser benchmark on fixtures S and M
# against bench/budgets.toml. Results are uploaded as artifacts (they feed gates only; published
# numbers come from the reference machine). A failed pass rule or budget fails the job.
# Still to come (BENCH-02/04): the Redis store, comparison with the median of the last seven
# nightly results, and an issue opened on failure.

name: Bench nightly

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BENCH_MACHINE: ci-ubuntu-latest

jobs:
  server-quick:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        store:
          - { name: sqlite, url: "" }
          - { name: mariadb, url: "mysql://root:root@127.0.0.1:33061/opencanvas" }
          - { name: mysql, url: "mysql://root:root@127.0.0.1:33062/opencanvas" }
    services:
      mariadb:
        image: mariadb:10.11
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: opencanvas }
        ports: ["33061:3306"]
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: opencanvas }
        ports: ["33062:3306"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p oc-server --bin opencanvas -p oc-bench --bin oc-bench
      - name: wait for the databases
        if: matrix.store.name != 'sqlite'
        run: for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/33061) 2>/dev/null && (echo > /dev/tcp/127.0.0.1/33062) 2>/dev/null && exit 0; sleep 2; done; exit 1
      - name: quick X10K, R1K, STORM
        env:
          SKIP_BUILD: "1"
          DATABASE_URL: ${{ matrix.store.url }}
        run: |
          set -u; rc=0
          for s in x10k r1k storm; do
            scripts/bench/run "$s" --size quick --store ${{ matrix.store.name }} --strict 1 || rc=1
          done
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bench-server-${{ matrix.store.name }}, path: bench/results }

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: cargo build --release -p oc-server --bin opencanvas -p oc-bench --bin oc-bench
      - run: bash scripts/bench/check-fast.sh   # START: initial JS and --forbid (builds the editor)
      - run: npx playwright test -c perf/bench.config.ts
        working-directory: e2e
        env: { BENCH_FIXTURES: "s,m", BENCH_RUNS: "3", E2E_SKIP_BUILD: "1" }
      - run: node scripts/bench/check-browser.mjs bench/results/*-browser-ci-ubuntu-latest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bench-browser, path: bench/results }
