name: CI

on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly: long convergence fuzz
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  OC_DEV: "1"

jobs:
  rust:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check-spdx.sh   # every source file carries the Apache-2.0 SPDX header
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: node ../tools/check-px.mjs   # SCALE-01 / ADR-050: type and spacing in rem, breakpoints in em
      - run: node packages/client/scripts/gen.mjs --check   # HAPI-06: client types match openapi.json
      - run: pnpm -r test
        env: { OC_CONFORMANCE: skip }   # the server conformance run is the clients job
      - run: pnpm --filter @opencanvas/editor build
      - uses: actions/upload-artifact@v4
        with: { name: editor-dist, path: web/packages/editor/dist }

  clients:
    # HAPI-06/07: both API clients run the shared conformance suite (crates/oc-server/api/
    # conformance.json) against a real server. The Rust client runs it in `cargo test`
    # (rust job); here the TypeScript client runs it against the conformance_server example.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: cargo build -p oc-server --example conformance_server
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm --filter @opencanvas/client test && pnpm --filter @opencanvas/client build
        working-directory: web
        env: { OC_CONFORMANCE_BIN: "${{ github.workspace }}/target/debug/examples/conformance_server" }

  helm:
    # deploy/helm/opencanvas: lint + render the three supported shapes, and check that SQLite
    # with more than one replica is refused.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.19.0 }
      - name: lint + template
        working-directory: deploy/helm
        run: |
          set -e
          for v in sqlite cluster gotenberg monitoring; do
            helm lint opencanvas --strict -f opencanvas/ci/$v-values.yaml
            helm template oc opencanvas -f opencanvas/ci/$v-values.yaml > /dev/null
          done
          # OPS-01: the dashboard, ServiceMonitor and PrometheusRule render (and only when asked).
          helm template oc opencanvas -f opencanvas/ci/monitoring-values.yaml > /tmp/mon.yaml
          for k in ServiceMonitor PrometheusRule; do grep -q "^kind: $k" /tmp/mon.yaml; done
          grep -q 'grafana_dashboard: "1"' /tmp/mon.yaml
          if helm template oc opencanvas -f opencanvas/ci/sqlite-values.yaml | grep -q "^kind: PrometheusRule"; then
            echo "monitoring objects must be off by default"; exit 1
          fi
      - name: dashboard is generated + alert rules (promtool)
        run: |
          set -e
          python3 deploy/monitoring/build-dashboard.py
          git diff --exit-code deploy/helm/opencanvas/files/opencanvas-dashboard.json
          docker run --rm -v "$PWD/deploy":/w -w /w/monitoring --entrypoint promtool prom/prometheus:v3.5.0 \
            check rules ../helm/opencanvas/files/opencanvas-alerts.yml
          docker run --rm -v "$PWD/deploy":/w -w /w/monitoring --entrypoint promtool prom/prometheus:v3.5.0 \
            test rules alerts-test.yml
          helm template oc deploy/helm/opencanvas --set gotenberg.enabled=true --set gotenberg.mode=sidecar --set dev=true > /dev/null
          if helm template oc deploy/helm/opencanvas --set dev=true --set replicaCount=2 > /dev/null 2>&1; then
            echo "SQLite with 2 replicas must be refused"; exit 1
          fi

  e2e:
    # Launch → edit over WebSocket → autosave lands in the host → export, on every supported database.
    needs: [rust, web]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db:
          # SQLite also renders a PDF through the Gotenberg service (ADR-010).
          - { name: sqlite, url: "", pdf: "gotenberg:http://localhost:3301" }
          - { name: mariadb, url: "mysql://root:root@127.0.0.1:33061/opencanvas", pdf: "" }
          - { name: mysql, url: "mysql://root:root@127.0.0.1:33062/opencanvas", pdf: "" }
    services:
      mariadb:
        image: mariadb:11.4
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: opencanvas }
        ports: ["33061:3306"]
        options: --health-cmd="healthcheck.sh --connect" --health-interval=5s --health-retries=20
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: opencanvas }
        ports: ["33062:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-retries=20
      gotenberg:
        image: gotenberg/gotenberg:8
        ports: ["3301:3000"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: cargo build --release -p oc-server --bins --examples
      - run: sudo apt-get install -y poppler-utils
        if: matrix.db.pdf != ''
      - run: scripts/e2e-db.sh ${{ matrix.db.name }} ${{ matrix.db.url }}
        env: { OC_PDF_RENDERER: "${{ matrix.db.pdf }}" }

  browser-e2e:
    # Playwright (e2e/): real oc-server on :8280 + sample hosts on :4200/:4201 started by the
    # suite, two browser contexts per spec, Chromium desktop + WebKit at phone size.
    needs: [rust, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium webkit
        working-directory: e2e
      - run: npm run e2e
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

  fuzz:
    # Convergence fuzz, 10 000 random rooms in release (docs/15 §8). Nightly and on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p oc-server --test fuzz -- --nocapture
        # A new base seed every run; a failure prints the seed to replay (OC_FUZZ_SEED=<n> OC_FUZZ_ITERS=1).
        env: { OC_FUZZ_ITERS: "10000", OC_FUZZ_SEED: "${{ github.run_number }}000000" }
