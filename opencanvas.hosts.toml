# OpenCanvas host registry (docs/05 §2). Development example only:
# the secret below is public. In production use `jwt_secret = "env:NAME"`.
# OC_CALLBACK_BASE_OVERRIDE replaces callback_base for every host (compose/dev only).

[[host]]
id              = "sample"
name            = "Sample host"
mode            = "jwt"
jwt_alg         = "HS256"
jwt_secret      = "dev-secret-change-me"
callback_base   = "http://localhost:4000/api/opencanvas"
allowed_origins = ["http://localhost:4000"]

[host.flags]
export_formats = ["md", "html", "json", "ocanvas"]
