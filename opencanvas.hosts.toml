# OpenCanvas host registry (docs/05 §2). Development example only:
# the secret below is public. In production use `jwt_secret = "env:NAME"`.
# OC_CALLBACK_BASE_OVERRIDE replaces callback_base for every host (compose/dev only).

[[host]]
id              = "sample"
name            = "Sample host"
mode            = "jwt"
jwt_alg         = "HS256"
jwt_secret      = "dev-secret-change-me"
api_key         = "dev-api-key-change-me"     # X-OpenCanvas-Key for the role / session API
callback_base   = "http://localhost:4000/api/opencanvas"
allowed_origins = ["http://localhost:4000"]

[host.flags]
export_formats = ["md", "html", "json", "docx", "pdf", "ocanvas", "svg", "png"]
on_conflict    = "copy"                        # copy | reload (on a 409 from PUT /files/{id})
team_templates = true                         # TPL-01: GET /templates feeds the gallery's "From your team"
api_v1         = true                         # HAPI-01: headless API under /api/v1 (docs/05 §7b)
history        = true                         # VH-01: GET /files/{id}/versions and /versions/{v} exist (docs/05 §5)

# Version history sources (docs/05 §2, ADR-055). In-file history is on by default for JWT hosts.
[host.versions]
file              = true                       # bounded history inside the .ocanvas
file_max_kb       = 1024
file_max_versions = 50
prefer_host       = true                       # the host's list comes first; in-file is "recent changes"

# WOPI-compatible host (docs/05 §6): examples/wopi-host/server.mjs. No JWT; OpenCanvas calls
# CheckFileInfo / GetFile / PutFile on WOPISrc, which must match wopi_allowlist.
[[host]]
id              = "wopi-sample"
name            = "WOPI sample host"
mode            = "wopi"
api_key         = "dev-wopi-api-key-change-me" # optional: role / commit / patch API
wopi_allowlist  = ["http://localhost:4300"]    # scheme://host[:port][/path] prefixes of WOPISrc
allowed_origins = ["http://localhost:4300"]

[host.flags]
on_conflict     = "copy"                       # copy = PUT_RELATIVE | reload
