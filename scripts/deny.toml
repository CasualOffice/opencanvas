# Used by scripts/audit.sh: cargo deny --config scripts/deny.toml check advisories bans licenses sources
# Every ignore says why it does not apply (docs/18, "Dependencies"); re-check on each audit.

[advisories]
ignore = [
  # DEP-01 (2026-11-28): rsa 0.9 and crypto-bigint 0.5 are gone (jsonwebtoken 12, p256 0.14);
  # rustybuzz and ttf-parser are gone (resvg 0.50; font fallback uses skrifa).
  # smallstr: unmaintained, through yrs 0.28 (latest). No vulnerability; small inline strings.
  { id = "RUSTSEC-2026-0215", reason = "unmaintained, no vulnerability; via yrs, no newer yrs" },
  # paste: unmaintained proc-macro (compile time only), via tikv-jemalloc-ctl. No vulnerability,
  # no code of it runs in the binary. Release audit v0.1.0-alpha.1.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time proc-macro, no vulnerability" },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The spreadsheet engine (oc-sheet, SHEET-01), pinned to a commit. Same owner.
allow-git = ["https://github.com/CasualOffice/opencalc"]

# Licences of every dependency: permissive only (no copyleft in the shipped binary). Our own
# crates are Apache-2.0 (LICENSE, NOTICE), already on the allow-list. `LGPL-2.1-or-later`
# appears only as an OR alternative.
[licenses]
confidence-threshold = 0.9
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-1-Clause", "BSD-2-Clause",
  "BSD-3-Clause", "BSL-1.0", "ISC", "Unicode-3.0", "Zlib", "0BSD", "CC0-1.0", "Unlicense",
  "CDLA-Permissive-2.0",
]
private = { ignore = true }
