[workspace]
resolver = "3"
members = ["crates/oc-model", "crates/oc-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"

[workspace.dependencies]
oc-model = { path = "crates/oc-model" }
yrs = { version = "0.28", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "any", "sqlite", "mysql", "mysql-rsa", "tls-rustls-ring-webpki", "migrate", "macros"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.9"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
ulid = "1"
base64 = "0.22"
futures = "0.3"
aes-gcm = "0.10"
resvg = { version = "0.47", default-features = false, features = ["text", "raster-images"] }
