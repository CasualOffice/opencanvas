# Scrapes OpenCanvas on the Docker host at :8791 (change the target for yours). With
# OC_METRICS_TOKEN set, add `authorization: { credentials: <token> }` to the job.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/opencanvas-alerts.yml
scrape_configs:
  - job_name: opencanvas
    static_configs:
      - targets: ["host.docker.internal:8791"]
        labels: { namespace: local }
