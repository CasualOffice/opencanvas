# OPS-01 local quick-start: Prometheus + Grafana with the OpenCanvas dashboard and alert rules.
# OpenCanvas itself runs on the Docker host at :8791 (cargo build, or the image with
# -p 8791:8080); see docs/13 "Dashboards and alerts" and deploy/monitoring/demo-load.sh.
#   docker compose -f deploy/monitoring/docker-compose.yml up -d
#   open http://localhost:3391/d/opencanvas-ops             # Grafana, anonymous viewer
#   open http://localhost:9391/alerts                       # Prometheus alerts
#   docker compose -f deploy/monitoring/docker-compose.yml down -v
# The dashboard and rules are the Helm chart's files (deploy/helm/opencanvas/files/).
name: opencanvas-monitoring
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    ports: ["9391:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../helm/opencanvas/files/opencanvas-alerts.yml:/etc/prometheus/opencanvas-alerts.yml:ro
  grafana:
    image: grafana/grafana-oss:12.1.1
    ports: ["3391:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin            # local quick-start only
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../helm/opencanvas/files/opencanvas-dashboard.json:/var/lib/grafana/dashboards/opencanvas-dashboard.json:ro
    depends_on: [prometheus]
