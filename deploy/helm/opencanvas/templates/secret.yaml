{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opencanvas.fullname" . }}
  labels:
    {{- include "opencanvas.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.kek }}
  OC_KEK: {{ . | quote }}
  {{- end }}
  {{- with .Values.database.url }}
  DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.redis.url }}
  REDIS_URL: {{ . | quote }}
  {{- end }}
  {{- range $k, $v := .Values.secrets.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
