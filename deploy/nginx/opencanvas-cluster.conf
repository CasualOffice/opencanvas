# OpenCanvas cluster load balancer (docs/13, ADR-006).
# - WebSocket /v1/collab/<room>: consistent hash on the room path segment, so every client of
#   a room lands on the same node (normally the owner: no relay). When that node is down the
#   ring moves the room to the next node, which takes the room over.
# - Everything else: round-robin (stateless HTTP; room calls are forwarded to the owner).
# - /v1/internal/ is node-to-node only and never routed from outside.

map $uri $oc_room {
    ~^/v1/collab/(?<room>[^/]+)$ $room;
    default "";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream oc_collab {
    hash $oc_room consistent;
    server oc1:8080 max_fails=1 fail_timeout=10s;
    server oc2:8080 max_fails=1 fail_timeout=10s;
    server oc3:8080 max_fails=1 fail_timeout=10s;
}

upstream oc_http {
    server oc1:8080 max_fails=1 fail_timeout=10s;
    server oc2:8080 max_fails=1 fail_timeout=10s;
    server oc3:8080 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    client_max_body_size 32m;
    proxy_connect_timeout 1s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /v1/internal/ {
        return 404;
    }

    location /v1/collab/ {
        proxy_pass http://oc_collab;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://oc_http;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
