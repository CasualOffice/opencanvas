# OpenCanvas Workspace behind one port (docs/40 §3, §8): the Workspace answers /, /ws/ and
# /api/ws/; everything else is the engine (two nodes, rooms hashed like the cluster config).

map $uri $oc_room {
    ~^/v1/collab/(?<room>[^/]+)$ $room;
    default "";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream workspace {
    server workspace:8080;
}

upstream engine_collab {
    hash $oc_room consistent;
    server engine1:8080 max_fails=1 fail_timeout=10s;
    server engine2:8080 max_fails=1 fail_timeout=10s;
}

upstream engine {
    server engine1:8080 max_fails=1 fail_timeout=10s;
    server engine2:8080 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    client_max_body_size 100m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = / { proxy_pass http://workspace; }
    location /ws/ { proxy_pass http://workspace; }
    location /api/ws/ { proxy_pass http://workspace; }

    location /v1/internal/ { return 404; }

    location /v1/collab/ {
        proxy_pass http://engine_collab;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://engine;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
