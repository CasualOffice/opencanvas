# OpenCanvas Workspace, production shape (ADR-085 §2, docs/40 §3): the same image run as one
# Workspace and two engine nodes (cluster mode with Redis), MariaDB for both (two databases),
# nginx in front on one port.
#   cp deploy/workspace/.env.example deploy/workspace/.env   # then fill in real secrets
#   docker compose -f deploy/workspace/compose.yml --env-file deploy/workspace/.env up -d
#   open http://localhost:8090 (WS_PUBLIC_URL)
# S3-compatible storage (MinIO) joins when WS-11's S3 store lands; files are on the volume now.

x-image: &image
  image: ghcr.io/casualoffice/opencanvas-workspace:${WS_VERSION:-latest}
  build: { context: ../.., dockerfile: deploy/workspace/Dockerfile }
  restart: unless-stopped
  stop_grace_period: 30s

x-secrets: &secrets
  WS_HOST_SECRET: ${WS_HOST_SECRET:?set WS_HOST_SECRET (64 hex characters)}
  WS_HOST_API_KEY: ${WS_HOST_API_KEY:?set WS_HOST_API_KEY}
  WS_TOKEN_KEY: ${WS_TOKEN_KEY:?set WS_TOKEN_KEY (64 hex characters)}
  OC_KEK: ${OC_KEK:?set OC_KEK (base64 of 32 bytes)}
  WS_PUBLIC_URL: ${WS_PUBLIC_URL:-http://localhost:8090}
  # The engine nodes and the Workspace reach each other inside the network.
  WS_ENGINE_URL: http://nginx:80
  WS_CALLBACK_BASE: http://workspace:8080/api/ws/oc

x-engine: &engine
  <<: *image
  command: ["--role", "engine"]
  depends_on:
    mariadb: { condition: service_healthy }
    redis: { condition: service_healthy }

x-engine-env: &engine-env
  <<: *secrets
  WS_BIND: 0.0.0.0:8080
  WS_DATA_DIR: /data
  DATABASE_URL: mysql://opencanvas:${DB_PASSWORD:-opencanvas}@mariadb:3306/opencanvas
  REDIS_URL: redis://redis:6379
  OC_CLUSTER_SECRET: ${OC_CLUSTER_SECRET:?set OC_CLUSTER_SECRET}

services:
  workspace:
    <<: *image
    command: ["--role", "workspace"]
    environment:
      <<: *secrets
      WS_BIND: 0.0.0.0:8080
      WS_DATABASE_URL: mysql://opencanvas:${DB_PASSWORD:-opencanvas}@mariadb:3306/workspace
      WS_TRUST_PROXY: "1"
    volumes: [workspace-data:/data]
    depends_on:
      mariadb: { condition: service_healthy }

  engine1:
    <<: *engine
    environment: { <<: *engine-env, OC_NODE_ID: engine1, OC_CLUSTER_ADVERTISE: "http://engine1:8080" }
  engine2:
    <<: *engine
    environment: { <<: *engine-env, OC_NODE_ID: engine2, OC_CLUSTER_ADVERTISE: "http://engine2:8080" }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["${WS_PORT:-8090}:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [workspace, engine1, engine2]

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: opencanvas
      MARIADB_USER: opencanvas
      MARIADB_PASSWORD: ${DB_PASSWORD:-opencanvas}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - db-data:/var/lib/mysql
      # The Workspace keeps its own database next to the engine's (each has a migrations table).
      - ./mariadb-init.sql:/docker-entrypoint-initdb.d/10-workspace.sql:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  workspace-data: {}
  db-data: {}
