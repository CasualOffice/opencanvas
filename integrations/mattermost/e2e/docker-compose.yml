# Local Mattermost for the plugin's end-to-end run (README "Verified"). OpenCanvas runs on the
# Docker host at :8090; Mattermost reaches it at host.docker.internal.
#
#   docker compose -f integrations/mattermost/e2e/docker-compose.yml up -d
#   docker compose -f integrations/mattermost/e2e/docker-compose.yml down -v
name: oc-mattermost-e2e
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmuser-e2e-only
      POSTGRES_DB: mattermost
    tmpfs: [/var/lib/postgresql/data]
  mattermost:
    # No arm64 build of team edition 12.1.0: runs emulated on Apple silicon.
    image: mattermost/mattermost-team-edition:12.1.0
    platform: linux/amd64
    depends_on: [postgres]
    ports: ["8065:8065"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:mmuser-e2e-only@postgres:5432/mattermost?sslmode=disable
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
      MM_GUESTACCOUNTSSETTINGS_ENABLE: "true"
      MM_SERVICESETTINGS_ENABLEDEVELOPER: "true"
