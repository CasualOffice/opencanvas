[package]
name = "oc-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opencanvas"
path = "src/main.rs"

[dependencies]
libc = "0.2"
oc-model.workspace = true
async-trait = "0.1"
yrs.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
axum.workspace = true
sqlx.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
hmac.workspace = true
sha2.workspace = true
# BSDK-01: `[host.blocks] enabled = ["acme.okr@^1"]` (already in Cargo.lock; ADR-058).
semver = "1"
hex.workspace = true
ulid.workspace = true
base64.workspace = true
futures.workspace = true
aes-gcm.workspace = true
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
rsa.workspace = true
getrandom.workspace = true
bytes = "1"
# Unfurl (UNF-01): URL host types; already in the tree through reqwest.
url = "2"
# Cluster mode (ADR-006): Redis leases, node-to-node relay WebSocket.
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "connection-manager", "script", "streams"] }
tokio-tungstenite = "0.28"
# Allocator (docs/22 §9.6): jemalloc by default; mimalloc measured; neither = system.
mimalloc = { version = "0.1.52", optional = true, default-features = false }
libmimalloc-sys = { version = "0.1.49", optional = true, default-features = false, features = ["extended"] }
tikv-jemallocator = { version = "0.6.1", optional = true }
tikv-jemalloc-ctl = { version = "0.6.1", optional = true, features = ["stats"] }
tikv-jemalloc-sys = { version = "0.6.1", optional = true }

[features]
default = ["jemalloc"]
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl", "dep:tikv-jemalloc-sys"]
# Heap profiles (docs/22 §9.6): _RJEM_MALLOC_CONF=prof:true,... and jeprof; never in a release.
jemalloc-prof = ["jemalloc", "tikv-jemallocator/profiling"]

[dev-dependencies]
sqlx.workspace = true
tokio-tungstenite = "0.28"
zip.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }
