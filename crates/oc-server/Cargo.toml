[package]
name = "oc-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opencanvas"
path = "src/main.rs"

[dependencies]
oc-model.workspace = true
yrs.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
axum.workspace = true
sqlx.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
ulid.workspace = true
base64.workspace = true
futures.workspace = true
aes-gcm.workspace = true
bytes = "1"
async-trait = "0.1"
# Cluster mode (ADR-006): Redis leases, node-to-node relay WebSocket.
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "connection-manager", "script", "streams"] }
tokio-tungstenite = "0.28"

[dev-dependencies]
sqlx.workspace = true
tokio-tungstenite = "0.28"
zip.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }
