[package]
name = "oc-model"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yrs.workspace = true
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
thiserror.workspace = true
base64.workspace = true
resvg.workspace = true
tracing.workspace = true
# Same versions as resvg/usvg use; `fs` + `memmap` turn on system and OC_FONT_DIRS loading.
fontdb = { version = "0.23", default-features = false, features = ["std", "fs", "memmap"] }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
unicode-script = "0.5"
# DGM-15 diagram import (ADR-053, Proposed): already in Cargo.lock through resvg/usvg and reqwest.
roxmltree = "0.21"
flate2 = "1"
percent-encoding = "2"
# BSDK-01 (ADR-058, Proposed): JSON Schema `pattern` (linear-time engine) and manifest SemVer.
# regex's own dependencies (regex-automata, regex-syntax, aho-corasick, memchr) and semver
# are already in Cargo.lock; regex itself is the one new crate (MIT OR Apache-2.0).
regex = "1"
semver = "1"

[dev-dependencies]
zip.workspace = true
