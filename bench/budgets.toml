#
# Browser budgets (docs/36 §3.5, ADR-079). Budgets change only in a reviewed commit that says
# why; the baseline is never refreshed automatically.
#
#   [start]            checked on every push and PR (scripts/bench/check-fast.sh): the initial JS
#                      (entry + static imports, gzip) and no advanced module in that graph
#   [heap_mb]          JS heap after a forced GC, per fixture (Chromium, e2e/perf/first-screen.bench.ts)
#   [first_screen_ms]  launch → first block painted and caret placeable, median of the runs,
#                      Chromium, 4× CPU throttle, 40 Mbit/s, 40 ms RTT
#   heap and first screen are checked by the nightly job (scripts/bench/check-browser.mjs).

[start]
# The gate today. It steps 300 → 260 → 240 → 220 KB gzip as the lazy-loading work lands (LAZY-01);
# lower it here in the commit that makes room.
initial_js_kb = 300
steps_kb = [300, 260, 240, 220]
target_kb = 220
# Advanced modules that must load lazily (regular expressions on the source paths in each
# initial chunk's source map).
forbid = [
  "packages/database/src/",
  "packages/board/src/",
  "node_modules/.*/pdfjs-dist/",
  "node_modules/.*/marked/",
  "node_modules/.*/(lowlight|highlight\\.js)/",
  "node_modules/.*/prosemirror-tables/",
  "node_modules/.*/lucide-static/",
  "packages/editor/src/lib/exports",
  "packages/editor/src/lib/demo",
  "packages/editor/src/offline/(ui|controller)",
  "packages/editor/src/history/",
  "packages/editor/src/links/",
]


[heap_mb]
# Baseline 2026-11-26 (bench/results/2026-11-26-browser-local.json, Apple M4, Chromium 159):
# S 10.2, M 53.9, L 109.6, 50 MB 472.1. S and M may grow ≤ 5% (MEM); L and 50 MB hold the
# baseline + 5% until the MEM work (target L −40%) lowers them.
s = 10.7
m = 56.6
l = 115
50mb = 496

[first_screen_ms]
# Baseline medians: S 733, M 3,331, L 5,937, 50 MB 45,582 (4× CPU, 40 Mbit/s, 40 ms RTT).
# S, M and L leave room for runner noise; 50 MB is the PSYNC-A1 target (< 2 s), not met today
# and not in the nightly run.
s = 1000
m = 5500
l = 9000
50mb = 2000
