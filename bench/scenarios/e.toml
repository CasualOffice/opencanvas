# docs/22 scenario E, unchanged: run by `scripts/bench.sh E` (old numbers stay comparable).
name = "E"
legacy = "E"
description = "cluster mode: 3 nodes (MariaDB + Redis in Docker), B's load spread by room"
mix_note = "editors type 3-6 chars/s in bursts, active 60% of the time, plus caret awareness; 6% cell edits, 2% board drags"

