# SOAK (docs/36 §3.3): the X10K mix for 8 hours (before each release, on the reference machine).
name = "SOAK"
description = "X10K mix (10,000 connections, 500 rooms, 80/15/5) for 8 h, no faults"
not_measured = [
  "RSS is compared first bucket to last, not the first hour to every later hour",
]

[machine]
nodes = 1
vcpu = 4
ram_gb = 8

[load]
connections = 10000
rooms = 500
docs = "demo:3,big:1"
connect_rate = 250
probes_per_room = 2

[mix]
idle = 0.80
presence = 0.15
typing = 0.05
presence_hz = 2
typing_hz = 1

[run]
minutes = 480
bucket_secs = 60

[pass]
p99_ms = 250
rss_drift_pct = 10
no_drops = true

[size.quick]
connections = 1000
rooms = 50
minutes = 10
