# docs/22 scenario A, unchanged: run by `scripts/bench.sh A` (old numbers stay comparable).
name = "A"
legacy = "A"
description = "one big room: 10 to 550 clients (the room cap), 20% editors, demo doc, 60 s steps"
mix_note = "editors type 3-6 chars/s in bursts, active 60% of the time, plus caret awareness; 6% cell edits, 2% board drags"

[load]
connections = 550
rooms = 1
docs = "demo"

[mix]
idle = 0.8
presence = 0
typing = 0.2
typing_hz = 2.7

[run]
minutes = 6
