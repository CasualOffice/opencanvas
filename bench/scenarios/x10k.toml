# X10K (docs/36 §3.3): 10k connections over ≈ 500 rooms, 80/15/5 mix, kill -9 at minute 15.
name = "X10K"
description = "10,000 WebSockets over 500 rooms: 80% idle viewers, 15% presence-only (cursor 2/s), 5% typing 1 edit/s; demo and big seeds 3:1; kill -9 and restart at minute 15"
not_measured = [
  "0 acknowledged edits lost: proven by scenario R (oc-bench verify), not by this load run",
  "Redis + MySQL store: BENCH-02 (pass --store mysql with DATABASE_URL to run it by hand)",
]

[machine]   # the reference run; quick and short runs go anywhere
nodes = 1
vcpu = 4
ram_gb = 8

[load]
connections = 10000
rooms = 500
docs = "demo:3,big:1"
connect_rate = 250
probes_per_room = 2

[mix]
idle = 0.80
presence = 0.15
typing = 0.05
presence_hz = 2
typing_hz = 1

[run]
minutes = 30
bucket_secs = 60

[[faults]]
kind = "kill-restart"
at_min = 15

[pass]
p99_ms = 250
p99_grace_secs = 60
rss_mb = 6144
reconnect_secs = 60
no_drops = true

[size.quick]    # pull-request gate and nightly (docs/36 §3.4)
connections = 1000
rooms = 50
minutes = 5
fault_at_min = 2.5

[size.short]    # the full mix on a laptop in a few minutes
minutes = 4
bucket_secs = 30
fault_at_min = 2
